description: Seeeduino XIAO nRF52840 BLE battery sensor.

compatible: "xiao,battery"
include: sensor-device.yaml

properties:
  io-channels:
    required: true
    description: ADC channel for battery voltage reading
  
  sampling-time:
    type: int
    required: true
    description: Sampling time for sensor in seconds.

  read-gpios:
    type: phandle-array
    required: true
    description: GPIO pin for enabling reading.
